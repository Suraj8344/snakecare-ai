[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snakecare-api"
version = "0.1.0"
description = "SnakeCare AI backend foundation"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "firebase-admin>=6.6,<8",
  "httpx>=0.27,<1",
  "Pillow>=11,<13",
  "PyMuPDF>=1.24,<2",
  "PyJWT[crypto]>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-json-logger>=2,<4",
  "python-multipart>=0.0.12,<1",
  "pytesseract>=0.3.13,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a real PostgreSQL database"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
