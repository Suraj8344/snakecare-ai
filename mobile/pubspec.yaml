name: snakecare_mobile
description: SnakeCare AI mobile foundation.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  file_selector: ^1.1.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  flutter_tts: ^4.2.5
  go_router: ^14.3.0
  geolocator: ^14.0.2
  connectivity_plus: ^7.0.0
  hive_flutter: ^1.1.0
  qr_flutter: ^4.1.0
  speech_to_text: ^7.4.0
  url_launcher: ^6.3.2
  youtube_player_iframe: ^5.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

# Keep Android path storage on the stable MethodChannel implementation. The
# newer adapter adds an NDK-built JNI layer, which is unnecessary for this app.
dependency_overrides:
  path_provider_android: 2.2.17

flutter:
  uses-material-design: true
